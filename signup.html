<!DOCTYPE html>
<html lang="zxx">
<head>
	<title>Muscle Up Gym</title>
	<meta charset="UTF-8">
	<meta name="description" content="X Gym Fitness HTML Template">
	<meta name="keywords" content="fitness, html">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link href="img/icons8-gym-25.png" rel="shortcut icon"/>
	<link href="https://fonts.googleapis.com/css?family=PT+Sans:400,400i,700,700i&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/bootstrap.min.css"/>
	<link rel="stylesheet" href="css/font-awesome.min.css"/>
	<link rel="stylesheet" href="css/owl.carousel.min.css"/>
	<link rel="stylesheet" href="css/flaticon.css"/>
	<link rel="stylesheet" href="css/slicknav.min.css"/>
	<link rel="stylesheet" href="css/style.css"/>

<style>
    input[type=text], input[type=password], input[type=email] {
        width: 100%;
        padding: 15px;
        margin: 5px 0 22px 0;
        display: inline-block;
        border: none;
        background: #f1f1f1;
    }
      
    input[type=text]:focus, input[type=password]:focus, input[type=email]:focus {
        background-color: #ddd;
        outline: none;
    }
      
    hr {
        border: 1px solid #f1f1f1;
        margin-bottom: 25px;
    }
      
    .registerbtn {
        background-color: #04AA6D;
        color: white;
        padding: 16px 20px;
        margin: 8px 0;
        border: none;
        cursor: pointer;
        width: 100%;
        opacity: 0.9;
    }
      
    .registerbtn:hover {
        opacity:1;
    }
      
    a {
        color: dodgerblue;
    }
      
    .signin {
        background-color: #f1f1f1;
        text-align: center;
    }

    /* Message styles */
    .message {
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        display: none;
    }
    .success {
        background-color: #d4edda;
        color: #155724;
    }
    .error {
        background-color: #f8d7da;
        color: #721c24;
    }
</style>
</head>
<body>
	<!-- Your existing header, navigation, and page top sections remain exactly the same -->

	<!-- Contact section - Modified form -->
	<section class="contact-section">
		<div class="container">
			<form id="signupForm">
                <div class="container">
                  <h1>SignUp</h1>
                  <p>Please fill in this form to create an account.</p>
                  <hr>
              
                  <label for="email"><b>Email</b></label>
                  <input type="email" placeholder="Enter Email" name="email" id="email" required>
              
                  <label for="psw"><b>Password</b></label>
                  <input type="password" placeholder="Enter Password" name="psw" id="psw" required>
              
                  <label for="psw-repeat"><b>Repeat Password</b></label>
                  <input type="password" placeholder="Repeat Password" name="psw-repeat" id="psw-repeat" required>
                  <hr>
             
                  <p>By creating an account you agree to our <a href="#">Terms & Privacy</a>.</p>
                  <br>
                  <button type="submit" class="registerbtn">Register</button>
                  <div id="message" class="message"></div>
                  <br><br>
                </div>
              
                <div class="container signin">
                  <p>Already have an account? <a href="/login.html">Login</a>.</p>
                </div>
              </form>
		</div>
	</section>

	<!-- Your existing footer section remains exactly the same -->

	<!-- Added Azure Table Storage JavaScript SDK -->
	<script src="https://cdn.jsdelivr.net/npm/@azure/data-tables@12.0.0/dist/index.min.js"></script>
	
	<!-- Your existing JavaScript files -->
	<script src="js/jquery-3.2.1.min.js"></script>
	<script src="js/bootstrap.min.js"></script>
	<script src="js/jquery.slicknav.js"></script>
	<script src="js/owl.carousel.min.js"></script>
	<script src="js/circle-progress.min.js"></script>
	<script src="js/main.js"></script>

	<!-- Signup JavaScript -->
	<script>
		// Azure Table Storage configuration
		const accountName = "gym"; // Replace with your account name
		const accountKey = "29vrKV2Wq1R6Lwg5EJ7zuifacwen+9HNP6eHiPj8mxXzHeqS/4y8F9m8re6FEoVFcutcA8Z03VW4+AStMqkibw=="; // Replace with your account key
		const tableName = "gymusers";
		
		// Initialize Azure Table Client
		const credential = new AzureTables.AzureNamedKeyCredential(accountName, accountKey);
		const client = new AzureTables.TableClient(
			`https://${accountName}.table.core.windows.net`,
			tableName,
			credential
		);

		// Create table if it doesn't exist
		client.createTable().catch(err => {
			console.log("Table already exists or connection issue:", err.message);
		});

		// Form submission handler
		document.getElementById("signupForm").addEventListener("submit", async function(event) {
			event.preventDefault();
			
			const email = document.getElementById("email").value;
			const password = document.getElementById("psw").value;
			const confirmPassword = document.getElementById("psw-repeat").value;
			const messageEl = document.getElementById("message");
			
			// Clear previous messages
			messageEl.style.display = "none";
			
			// Validate inputs
			if (!email || !password || !confirmPassword) {
				showMessage("All fields are required", "error");
				return;
			}
			
			if (password !== confirmPassword) {
				showMessage("Passwords do not match", "error");
				return;
			}
			
			if (password.length < 6) {
				showMessage("Password must be at least 6 characters", "error");
				return;
			}
			
			try {
				// Check if user already exists
				const existingUser = await client.getEntity("users", email).catch(() => null);
				if (existingUser) {
					showMessage("Email already registered", "error");
					return;
				}
				
				// Create new user entity
				const userEntity = {
					partitionKey: "users",
					rowKey: email,
					email: email,
					password: password, // Note: In production, hash this password!
					signupDate: new Date().toISOString()
				};
				
				// Save to Azure Table Storage
				await client.createEntity(userEntity);
				
				showMessage("Registration successful! Redirecting to login...", "success");
				
				// Clear form and redirect after 2 seconds
				document.getElementById("signupForm").reset();
				setTimeout(() => {
					window.location.href = "/login.html";
				}, 2000);
				
			} catch (error) {
				console.error("Registration error:", error);
				showMessage("Registration failed. Please try again.", "error");
			}
		});
		
		function showMessage(text, type) {
			const messageEl = document.getElementById("message");
			messageEl.textContent = text;
			messageEl.className = `message ${type}`;
			messageEl.style.display = "block";
		}
	</script>
</body>
</html>
